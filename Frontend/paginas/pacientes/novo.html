<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Novo Cadastro - CAIGE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="../../recursos/css/base.css" />
  <link rel="stylesheet" href="../../recursos/css/componentes.css" />
  <link rel="stylesheet" href="../../recursos/css/layout.css" />
  <link rel="stylesheet" href="../../recursos/css/responsive.css" />
  <link rel="stylesheet" href="../../recursos/css/paginas/pacientes.css" />
  <script src="../../recursos/js/text-normalizer.js"></script>
</head>

<body data-page-title="Novo Cadastro" data-page-subtitle="Registre um novo paciente no sistema">
  <div class="dashboard">
    <div id="shell-sidebar"></div>

    <main class="content">
      <div id="shell-header"></div>

      <div class="breadcrumb largura-pagina">
        <a href="./lista.html">Pacientes Cadastrados</a>
        <span>></span>
        <span>Novo Cadastro</span>
      </div>

      <form id="patient-form" class="form-container largura-pagina" novalidate>
        <!-- 1. Informações Pessoais -->
        <section class="card form-section">
          <h3 class="section-title">Informações Pessoais</h3>
          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="full-name">Nome completo *</label>
              <input type="text" id="full-name" name="full_name" placeholder="Nome completo do paciente" required />
            </div>

            <div class="form-group">
              <label for="birth-date">Data de nascimento *</label>
              <input type="text" id="birth-date" name="birth_date" title="Selecione a data de nascimento"
                autocomplete="off" required />
            </div>

            <div class="form-group">
              <label for="age">Idade</label>
              <input type="text" id="age" name="age" placeholder="Calculada automaticamente" disabled />
            </div>

            <div class="form-group">
              <label for="gender">Sexo</label>
              <select id="gender" name="gender">
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cpf">CPF ou Documento *</label>
              <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required />
            </div>
          </div>
        </section>

        <!-- 2. Contato e Endereço -->
        <section class="card form-section">
          <h3 class="section-title">Contato e Endereço</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="phone1">Telefone residencial</label>
              <input type="tel" id="phone1" name="phone1" placeholder="(00) 0000-0000" maxlength="14" />
            </div>

            <div class="form-group">
              <label for="phone2">Celular</label>
              <input type="tel" id="phone2" name="phone2" placeholder="(00) 00000-0000" maxlength="15" />
            </div>

            <div class="form-group form-group--full">
              <small class="form-hint">Preencha ao menos Telefone residencial ou Celular.</small>
            </div>

            <div class="form-group">
              <label for="cep">CEP *</label>
              <input type="text" id="cep" name="cep" placeholder="00000-000" required />
            </div>

            <div class="form-group">
              <label for="street">Rua *</label>
              <input type="text" id="street" name="street" placeholder="Rua" required />
            </div>

            <div class="form-group">
              <label for="number">Número *</label>
              <input type="text" id="number" name="number" placeholder="Número" required />
            </div>

            <div class="form-group">
              <label for="neighborhood">Bairro *</label>
              <input type="text" id="neighborhood" name="neighborhood" placeholder="Bairro" required />
            </div>

            <div class="form-group">
              <label for="city">Cidade *</label>
              <input type="text" id="city" name="city" placeholder="Cidade" required />
            </div>

            <div class="form-group">
              <label for="state">Estado *</label>
              <select id="state" name="state" required>
                <option value="">Selecione</option>
                <option value="MG">Minas Gerais</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="BA">Bahia</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
                <option value="PE">Pernambuco</option>
                <option value="GO">Goiás</option>
                <option value="PA">Pará</option>
              </select>
            </div>
          </div>
        </section>

        <!-- 3. Informações Complementares -->
        <section class="card form-section">
          <h3 class="section-title">Informações Complementares</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="responsible">Responsável (nome) *</label>
              <input type="text" id="responsible" name="responsible" placeholder="Nome do responsável" required />
            </div>

            <div class="form-group">
              <label for="responsible-relationship">Grau de Parentesco</label>
              <select id="responsible-relationship" name="responsible_relationship">
                <option value="">Selecione</option>
                <option value="mae">Mãe</option>
                <option value="pai">Pai</option>
                <option value="filho">Filho</option>
                <option value="filha">Filha</option>
                <option value="esposo">Esposo</option>
                <option value="esposa">Esposa</option>
                <option value="irmao">Irmão</option>
                <option value="irma">Irmã</option>
                <option value="avó">Avó</option>
                <option value="avo">Avô</option>
                <option value="neto">Neto</option>
                <option value="neta">Neta</option>
                <option value="tio">Tio</option>
                <option value="tia">Tia</option>
                <option value="sobrinho">Sobrinho</option>
                <option value="sobrinha">Sobrinha</option>
                <option value="primo">Primo</option>
                <option value="prima">Prima</option>
                <option value="outro">Outro</option>
              </select>
            </div>

            <div class="form-group form-group--full">
              <label for="responsible-phone">Telefone do responsável *</label>
              <input type="tel" id="responsible-phone" name="responsible_phone" placeholder="(00) 00000-0000"
                maxlength="15" required />
            </div>
          </div>
        </section>

        <!-- 4. Informações Clínicas -->
        <section class="card form-section">
          <h3 class="section-title">Informações Clínicas</h3>
          <div class="form-grid">
            <div class="form-group">
              <label for="peso-kg">Peso atual (kg) *</label>
              <input type="text" id="peso-kg" name="weight_kg" inputmode="decimal"
                placeholder="Ex.: 72,5" required />
            </div>

            <div class="form-group">
              <label for="altura-cm">Altura (cm) *</label>
              <input type="text" id="altura-cm" name="height_cm" inputmode="numeric" maxlength="3"
                placeholder="Ex.: 165" required />
            </div>

            <div class="form-group form-group--full">
              <label>Índice de Massa Corporal (IMC)</label>
              <div class="imc-campo" id="imc-container" aria-live="polite">
                <span class="imc-campo__valor" id="imc-valor">—</span>
                <span class="imc-campo__classificacao status-pill" id="imc-badge">Informe peso e altura</span>
              </div>
            </div>

            <div class="form-group form-group--full clinical-shortcut-row">
              <label class="checkbox-field">
                <input type="checkbox" id="shortcut-no-clinical-records" />
                <span>Nenhuma condição, alergia ou medicamento em uso</span>
              </label>
            </div>

            <div class="form-group">
              <div class="form-group__label-row">
                <label for="condicoes-saude-entrada">Condições de Saúde *</label>
                <label class="checkbox-field checkbox-field--inline">
                  <input type="checkbox" id="nenhuma-condicao" />
                  <span>Nenhuma condição informada</span>
                </label>
              </div>
              <div class="editor-lista-clinica">
                <div class="editor-lista-clinica__entrada">
                  <input type="text" id="condicoes-saude-entrada" placeholder="Ex.: Diabetes Tipo 2" />
                  <button type="button" class="btn btn--secondary editor-lista-clinica__adicionar"
                    id="condicoes-saude-adicionar">Adicionar</button>
                </div>
                <input type="hidden" id="health-conditions" name="health_conditions" />
                <div class="editor-lista-clinica__itens" id="condicoes-saude-lista"></div>
              </div>
            </div>

            <div class="form-group">
              <div class="form-group__label-row">
                <label for="alergias-entrada">Alergias *</label>
                <label class="checkbox-field checkbox-field--inline">
                  <input type="checkbox" id="nenhuma-alergia" />
                  <span>Nenhuma alergia conhecida</span>
                </label>
              </div>
              <div class="editor-lista-clinica">
                <div class="editor-lista-clinica__entrada">
                  <input type="text" id="alergias-entrada" placeholder="Ex.: Dipirona" />
                  <button type="button" class="btn btn--secondary editor-lista-clinica__adicionar"
                    id="alergias-adicionar">Adicionar</button>
                </div>
                <input type="hidden" id="allergies" name="allergies" />
                <div class="editor-lista-clinica__itens" id="alergias-lista"></div>
              </div>
            </div>

            <div class="form-group form-group--full">
              <div class="form-group__label-row">
                <label for="medicamentos-entrada">Medicamentos em Uso *</label>
                <label class="checkbox-field checkbox-field--inline">
                  <input type="checkbox" id="nenhum-medicamento" />
                  <span>Não utiliza medicamentos</span>
                </label>
              </div>
              <div class="editor-lista-clinica">
                <div class="editor-lista-clinica__entrada">
                  <input type="text" id="medicamentos-entrada" placeholder="Ex.: Metformina 850 mg" />
                  <button type="button" class="btn btn--secondary editor-lista-clinica__adicionar"
                    id="medicamentos-adicionar">Adicionar</button>
                </div>
                <input type="hidden" id="medications" name="medications_in_use" />
                <div class="editor-lista-clinica__itens editor-lista-clinica__itens--lista" id="medicamentos-lista"></div>
              </div>
            </div>

            <div class="form-group form-group--full">
              <label for="clinical-observations">Observações Clínicas</label>
              <textarea id="clinical-observations" name="clinical_observations"
                placeholder="Anotações clínicas importantes..." rows="3"></textarea>
            </div>
          </div>
        </section>

        <!-- 5. Situação e Observações Gerais -->
        <section class="card form-section">
          <h3 class="section-title">Situação e Observações Gerais</h3>
          <div class="form-grid">
            <div class="form-group form-group--full">
              <label for="observations">Observações gerais</label>
              <textarea id="observations" name="observations" placeholder="Informações adicionais relevantes..."
                rows="4"></textarea>
            </div>

            <div class="form-group">
              <label for="status">Situação do cadastro *</label>
              <select id="status" name="status" required>
                <option value="">Selecione</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
              </select>
            </div>

            <div class="form-actions form-group--full">
              <button type="button" class="btn btn--secondary" onclick="window.location.href='./lista.html'">
                Cancelar
              </button>
              <button type="submit" class="btn btn--primary">
                Salvar Cadastro
              </button>
            </div>
          </div>
        </section>
      </form>
  </div>

  <script src="../../recursos/js/icones.js"></script>
  <script src="../../recursos/js/notificacoes.js"></script>
  <script src="../../recursos/js/modal-confirmacao.js"></script>
  <script src="../../recursos/js/util-jwt.js"></script>
  <script src="../../recursos/js/shell-global.js"></script>
  <script src="../../recursos/js/sidebar-menu.js"></script>
  <script src="../../recursos/js/menu-usuario.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
  <script src="../../recursos/js/date-picker-ptbr.js"></script>
  <script src="../../recursos/js/formatador-texto.js"></script>
  <script src="../../recursos/js/paciente-form-utils.js"></script>
  <script>
    const API_URL = '';
    const form = document.getElementById('patient-form');
    const birthDateInput = document.getElementById('birth-date');
    const ageInput = document.getElementById('age');
    const [birthDatePicker] = window.initPtBrDatePicker ? window.initPtBrDatePicker('#birth-date') : [];

    const editoresClinicos = PatientFormUtils.inicializarEditoresClinicosPaciente();
    const controlesClinicos = PatientFormUtils.configurarControlesClinicosSemOcorrencia(editoresClinicos);

    if (!birthDatePicker) {
      birthDateInput.type = 'date';
      birthDateInput.lang = 'pt-BR';
    }

    // Obter email do localStorage
    const userEmail = localStorage.getItem('userEmail');
    if (!userEmail) { window.location.href = '../autenticacao/entrar.html'; }

    function parseBirthDateParts(value) {
      const raw = String(value || '').trim();
      const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);

      if (!match) {
        return null;
      }

      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      const date = new Date(year, month - 1, day);

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }

      return { day, month, year, date };
    }

    function updateAgeFromBirthDate(showWarning = false) {
      const parsed = parseBirthDateParts(birthDateInput.value);

      if (!birthDateInput.value) {
        ageInput.value = '';
        birthDateInput.setCustomValidity('');
        return false;
      }

      if (!parsed) {
        ageInput.value = '';
        birthDateInput.setCustomValidity('Selecione uma data válida');
        if (showWarning) {
          birthDateInput.reportValidity();
        }
        return false;
      }

      const age = window.PatientFormUtils?.calcularIdade
        ? window.PatientFormUtils.calcularIdade(parsed)
        : null;

      if (age === null || age < 0 || age > 150) {
        ageInput.value = '';
        birthDateInput.setCustomValidity('Data de nascimento inválida');
        if (showWarning) {
          birthDateInput.reportValidity();
        }
        return false;
      }

      birthDateInput.setCustomValidity('');
      ageInput.value = age;
      return true;
    }

    birthDateInput.addEventListener('input', function () {
      birthDateInput.setCustomValidity('');
    });

    birthDateInput.addEventListener('blur', function () {
      updateAgeFromBirthDate(true);
    });

    birthDateInput.addEventListener('change', function () {
      updateAgeFromBirthDate(false);
    });

    PatientFormUtils.attachPhoneMasks();
    PatientFormUtils.attachCpfMask();
    PatientFormUtils.attachCepAutoFill({
      onNotFound: () => notify.warning('CEP não encontrado'),
      onFilled: () => notify.success('Endereço preenchido automaticamente!'),
      onError: (error) => console.error('Erro ao buscar CEP:', error)
    });
    PatientFormUtils.vincularCalculoIMC();
    PatientFormUtils.vincularRestricaoAltura(document.getElementById('altura-cm'));

    // Enviar formulário
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.textContent;

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Salvando...';

        const rawWeight = document.getElementById('peso-kg').value.trim();
        const rawHeight = document.getElementById('altura-cm').value.trim();

        const formData = PatientFormUtils.normalizePatientTextFields({
          name: document.getElementById('full-name').value.trim(),
          birth_date: PatientFormUtils.convertBrDateToDb(document.getElementById('birth-date').value),
          gender: document.getElementById('gender').value || null,
          cpf: document.getElementById('cpf').value.trim() || null,
          phone: document.getElementById('phone1').value.trim() || null,
          phone2: document.getElementById('phone2').value.trim() || null,
          cep: document.getElementById('cep').value.trim() || null,
          street: document.getElementById('street').value.trim(),
          number: document.getElementById('number').value.trim(),
          neighborhood: document.getElementById('neighborhood').value.trim(),
          city: document.getElementById('city').value.trim(),
          state: document.getElementById('state').value,
          responsible: document.getElementById('responsible').value.trim(),
          responsible_relationship: document.getElementById('responsible-relationship').value || null,
          responsible_phone: document.getElementById('responsible-phone').value.trim() || null,
          observations: document.getElementById('observations').value.trim() || null,
          health_conditions: document.getElementById('nenhuma-condicao')?.checked
            ? null
            : (document.getElementById('health-conditions').value.trim() || null),
          health_conditions_evaluated: Boolean(
            document.getElementById('health-conditions').value.trim() ||
            document.getElementById('nenhuma-condicao')?.checked
          ),
          has_no_health_conditions: Boolean(document.getElementById('nenhuma-condicao')?.checked),
          allergies: document.getElementById('nenhuma-alergia')?.checked
            ? null
            : (document.getElementById('allergies').value.trim() || null),
          allergies_evaluated: Boolean(
            document.getElementById('allergies').value.trim() ||
            document.getElementById('nenhuma-alergia')?.checked
          ),
          has_no_allergies: Boolean(document.getElementById('nenhuma-alergia')?.checked),
          medications_in_use: document.getElementById('nenhum-medicamento')?.checked
            ? null
            : (document.getElementById('medications').value.trim() || null),
          medications_in_use_evaluated: Boolean(
            document.getElementById('medications').value.trim() ||
            document.getElementById('nenhum-medicamento')?.checked
          ),
          has_no_medications: Boolean(document.getElementById('nenhum-medicamento')?.checked),
          clinical_observations: document.getElementById('clinical-observations').value.trim() || null,
          weight_kg: PatientFormUtils.normalizarPesoKg(rawWeight) ?? rawWeight,
          height_cm: rawHeight,
          status: document.getElementById('status').value
        });

        const validacao = PatientFormUtils.validarEExibirErrosFormulario(form, formData);
        if (!validacao.valido) {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
          return;
        }

        const userEmail = localStorage.getItem('userEmail');
        const response = await fetch(`${API_URL}/api/pacientes`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': userEmail
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (response.ok) {
          notify.success('Paciente cadastrado com sucesso!');
          setTimeout(() => {
            window.location.href = './lista.html';
          }, 3000);
        } else {
          notify.error(data.message || 'Erro ao cadastrar paciente');
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      } catch (error) {
        console.error('Erro:', error);
        notify.error('Erro ao conectar com o servidor');
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar Cadastro';
      }
    });



  </script>
</body>

</html>
